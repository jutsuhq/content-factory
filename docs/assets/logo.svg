<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232326"/>
      <stop offset="1" stop-color="#0c0c0e"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#FFA53D"/>
      <stop offset=".55" stop-color="#FF6B4A"/>
      <stop offset="1" stop-color="#FF3D7F"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".35" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-20%" width="160%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dx="-18" dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <!-- macOS tile: 824 of 1024, corner radius 186 -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  <g clip-path="url(#clip)">
    <ellipse cx="560" cy="540" rx="260" ry="300" fill="#FF6B3D" opacity=".28" filter="url(#glow)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="url(#edge)" stroke-width="3"/>

  <!-- three frames, same shape, scale 0.8 / 0.9 / 1, equal 85 px steps, centred on the tile -->
  <g filter="url(#shadow)">
    <rect x="277" y="304" width="240" height="416" rx="48" fill="url(#card)"/>
    <rect x="277" y="304" width="240" height="416" rx="48" fill="#0c0c0e" opacity=".55"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="362" y="278" width="270" height="468" rx="52" fill="url(#card)"/>
    <rect x="362" y="278" width="270" height="468" rx="52" fill="#0c0c0e" opacity=".3"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="447" y="252" width="300" height="520" rx="56" fill="url(#card)"/>
    <rect x="447" y="252" width="300" height="520" rx="56" fill="url(#shine)"/>
  </g>

  <!-- play: centroid on the front frame's centre (597, 512) -->
  <path d="M566 446 L566 578 L654 512 Z" fill="#141416" stroke="#141416" stroke-width="34" stroke-linejoin="round"/>
</svg>
