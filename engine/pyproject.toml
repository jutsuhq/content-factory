[project]
name = "content-factory"
version = "0.1.0"
description = "Open-source AI faceless video generator for TikTok, YouTube Shorts and Reels: the engine of Content Factory"
readme = "README.md"
keywords = ["faceless video", "ai video generator", "short video", "tiktok", "youtube shorts", "reels", "remotion", "mcp"]
authors = [{ name = "Jutsu Studio" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "jsonschema>=4.23",
  "mcp>=2.3",
  "num2words>=0.5.14",
  "numpy>=2.0",
  "onnxruntime>=1.20",
  "pillow>=11.0",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0",
  "uvicorn>=0.32",
]

[project.urls]
Homepage = "https://jutsustudio.com"
Repository = "https://github.com/jutsuhq/content-factory"
Documentation = "https://github.com/jutsuhq/content-factory/blob/main/docs/architecture.md"
Issues = "https://github.com/jutsuhq/content-factory/issues"

[project.optional-dependencies]
# Apple Silicon: TTS and speech-to-text on MLX.
mac = [
    "misaki[en]>=0.9",
    "mlx-audio>=0.2",
    "mlx-whisper>=0.4",
]
# Russian voice: Vosk-TTS with RUAccent stress, on CPU on every OS.
vosk = ["ruaccent>=1.5", "vosk-tts>=0.3.61"]
# Windows / Linux with NVIDIA: the same models on PyTorch CUDA (stage 0.4 still to verify).
cuda = ["faster-whisper>=1.1"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
factory = "factory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/factory/providers/image/private"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "SIM", "C4", "RUF", "PLE", "PLW", "C90"]
# texts on screen use typographic characters on purpose
ignore = ["RUF005"]  # [*a, b] over a + [b] is taste, not a defect
allowed-confusables = ["›", "×", "–", "−", "а", "е", "с", "о", "р", "х"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
include = ["src"]
exclude = ["src/factory/providers/image/private"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
# optional back ends (MLX, Vosk, CUDA) are not installed everywhere
reportMissingImports = "warning"
